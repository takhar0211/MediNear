{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nearby Hospitals</title>
  <style>
    :root{
      --bg: #9adcd1;
      --card: #276a6d;
      --card-accent: rgba(0,0,0,0.12);
      --card-radius: 14px;
      --text-light: #e8ffff;
      --muted: #d7f0ec;
      --card-min-height: 150px; /* base card height, responsive below */
    }
    html,body{
      height:100%;
      margin:0;
      font-family: "Arial", sans-serif;
      background: var(--bg);
      -webkit-font-smoothing:antialiased;
    }

    .page {
      max-width:1200px;
      margin: 24px auto;
      padding: 24px;
    }

    h1 {
      text-align:center;
      margin: 4px 0 24px;
      font-size: clamp(20px, 2.6vw, 32px);
      color: #0b4646;
      letter-spacing: 0.2px;
    }

    /* grid of cards - responsive */
    .grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      align-items: stretch;           /* important for equal heights */
      grid-auto-rows: 1fr;            /* ensures each row's cells stretch equally */
    }

    .card {
      background: var(--card);
      color: var(--text-light);
      padding: 18px;
      border-radius: var(--card-radius);
      box-shadow: 0 6px 12px var(--card-accent);
      display:flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: var(--card-min-height);
      height: 100%;                   /* let grid cell determine final height */
      box-sizing: border-box;
      overflow: hidden;
    }

    .card .title {
      font-weight: 700;
      font-size: clamp(15px, 1.8vw, 18px);
      margin-bottom: 6px;
      line-height: 1.15;
      display: -webkit-box;
      -webkit-line-clamp: 2;          /* clamp name to 2 lines */
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card .distance {
      font-size: clamp(12px, 1.3vw, 14px);
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* icons row */
    .icons {
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:flex-start;
      margin-top:8px;
      flex-wrap:wrap;
    }

    .icon-link {
      display:flex;
      align-items:center;
      gap:8px;
      background: rgba(255,255,255,0.06);
      padding:8px 12px;
      border-radius:10px;
      color: var(--text-light);
      text-decoration:none;
      font-size: clamp(12px, 1.2vw, 14px);
      transition: transform .08s ease, background .12s;
      min-width: 72px;
      justify-content: center;
    }
    .icon-link svg{ width:18px; height:18px; display:block; flex-shrink:0; }

    .icon-link:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.10);
    }

    .icon-link.disabled {
      opacity: .45;
      pointer-events: none;
      cursor: default;
    }

    /* hide long label text on small screens, keep icons visible */
    .icon-link .label {
      display:inline-block;
    }

    /* rating pill */
    .rating-pill {
      background: rgba(255,255,255,0.06);
      padding:6px 10px;
      border-radius: 999px;
      display:flex;
      gap:8px;
      align-items:center;
      font-weight:600;
      font-size: clamp(12px, 1.2vw, 14px);
    }

    /* vertical spacing for mobile */
    @media (max-width:680px){
      .page{ padding: 16px;}
      h1{ font-size:22px; }
      .icons { gap:8px; }
      .icon-link { padding:6px 8px; font-size:13px; min-width: 60px; }
    }

    /* very small screens: hide icon label text to save space */
    @media (max-width:420px){
      :root{ --card-min-height: 130px; }
      .icon-link .label { display:none; }
      .icon-link { padding:8px; }
      .card .title { font-size: 15px; -webkit-line-clamp: 1; } /* single line name on tiny screens */
    }

    /* scroll area (if lots of results) */
    .scroll-wrap{
      max-height: calc(100vh - 140px);
      overflow-y:auto;
      padding-right:6px;
    }

    /* subtle link underline */
    a.small-link {
      color: #d7f0ec;
      text-decoration: underline;
    }

    /* ensure consistent phone / rating pill layout */
    .icon-link span, .rating-pill { white-space: nowrap; }

  </style>
</head>
<body>
  <div class="page">
    <h1>Nearby Hospitals</h1>

    <div class="scroll-wrap">
      <div class="grid" id="hospitalGrid">
        <!-- cards injected here -->
      </div>
    </div>
  </div>

  <script>
    // hospitals array expected in localStorage: each object may look like this:
    // {
    //   "name": "Om Hospital, Pune",
    //   "distance_km": 1.33,
    //   "maps_link": "https://maps.google.com/?q=...",
    //   "phone": "+911234567890",      // optional
    //   "website": "https://...",      // optional
    //   "rating": 4.2                  // optional
    // }

    const hospitals = JSON.parse(localStorage.getItem("hospitals") || "[]");
    const grid = document.getElementById("hospitalGrid");

    function makeIconPhone() {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.78 19.78 0 0 1 3 5.18 2 2 0 0 1 5 3h3a2 2 0 0 1 2 1.72 12.08 12.08 0 0 0 .7 3.04 2 2 0 0 1-.45 2.11L9.91 11.09a16 16 0 0 0 6.92 6.92l1.2-1.35a2 2 0 0 1 2.11-.45 12.08 12.08 0 0 0 3.04.7A2 2 0 0 1 22 16.92z"></path>
        </svg>`;
    }

    function makeIconMap() {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 6-9 11-9 11s-9-5-9-11a9 9 0 1 1 18 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>`;
    }

    function makeIconSite() {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h3l3 8 4-16 3 8h4"></path>
      </svg>`;
    }

    function makeIconStar() {
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.788 1.402 8.168L12 18.896 4.664 23.166l1.402-8.168L.132 9.21l8.2-1.192z"/>
      </svg>`;
    }

    function createCard(h) {
      const name = h.name || "Unnamed Hospital";
      const distance = (h.distance_km !== undefined && h.distance_km !== null) ? `${Number(h.distance_km).toFixed(2)} km` : "Distance N/A";
      const phone = h.phone || null;
      const maps = h.maps_link || null;
      const website = h.website || null;
      const rating = (h.rating !== undefined && h.rating !== null) ? Number(h.rating).toFixed(1) : null;

      const phoneLink = phone ? `tel:${phone}` : null;
      const mapLink = maps ? maps : null;
      const siteLink = website ? website : (maps ? maps : null);

      const phoneClass = phoneLink ? "icon-link" : "icon-link disabled";
      const mapClass = mapLink ? "icon-link" : "icon-link disabled";
      const siteClass = siteLink ? "icon-link" : "icon-link disabled";
      const ratingClass = (rating !== null) ? "icon-link" : "icon-link disabled";

      const phoneLabel = phone ? `Call ${phone}` : "Phone not available";
      const mapLabel = maps ? "Open location in maps" : "Map link not available";
      const siteLabel = website ? "Open website" : (maps ? "Open in maps" : "Website not available");
      const ratingLabel = rating !== null ? `Rating ${rating} / 5` : "Rating not available";

      const card = document.createElement("div");
      card.className = "card";

      // Use small inline labels that will hide on very small screens (via CSS)
      card.innerHTML = `
        <div>
          <div class="title">${escapeHtml(name)}</div>
          <div class="distance">Distance: ${escapeHtml(distance)}</div>
        </div>

        <div class="icons" aria-hidden="false">
          <a class="${phoneClass}" ${phoneLink ? `href="${phoneLink}"` : ''} aria-label="${escapeHtml(phoneLabel)}">
            ${makeIconPhone()} <span class="label">${phone ? escapeHtml(formatPhoneDisplay(phone)) : 'N/A'}</span>
          </a>

          <a class="${mapClass}" ${mapLink ? `href="${mapLink}" target="_blank" rel="noopener noreferrer"` : ''} aria-label="${escapeHtml(mapLabel)}">
            ${makeIconMap()} <span class="label">Map</span>
          </a>

          <a class="${siteClass}" ${siteLink ? `href="${siteLink}" target="_blank" rel="noopener noreferrer"` : ''} aria-label="${escapeHtml(siteLabel)}">
            ${makeIconSite()} <span class="label">Site</span>
          </a>

          <div style="margin-left:auto;"></div>

          <a class="${ratingClass}" ${rating ? `href="${mapLink || siteLink || '#'}" target="_blank" rel="noopener noreferrer"` : ''} aria-label="${escapeHtml(ratingLabel)}">
            ${makeIconStar()} <span class="rating-pill">${rating !== null ? `${rating} ★` : 'N/A'}</span>
          </a>
        </div>
      `;

      return card;
    }

    // escape to avoid accidental HTML injection in stored data
    function escapeHtml(s){
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // small phone formatting for display (keeps original value in tel:)
    function formatPhoneDisplay(p){
      // if long, show compact version (naive rule)
      const trimmed = p.trim();
      if (trimmed.length > 18) return trimmed.slice(0, 15) + '…';
      return trimmed;
    }

    // Render
    grid.innerHTML = "";
    if (!hospitals.length) {
      grid.innerHTML = `<div style="grid-column:1/-1;color:#0b4646;padding:18px;background:rgba(255,255,255,0.18);border-radius:12px;text-align:center;">
        No hospitals found. Make sure you clicked "Find Nearby Hospitals" on the homepage and allowed location access.
      </div>`;
    } else {
      hospitals.forEach(h => {
        const c = createCard(h);
        grid.appendChild(c);
      });
    }

  </script>
</body>
</html>
